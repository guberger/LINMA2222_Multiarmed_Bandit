[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linma2222-multiarmed-bandit"
version = "0.1.0"
description = "Interactive multi-armed bandit teaching demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7,<4"]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[project.scripts]
bandit-demo = "bandit_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
